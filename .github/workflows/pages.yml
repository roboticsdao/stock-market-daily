name: Publish Pages
on:
  push:
    branches: [main]
    paths: ['**.html', '**.json', 'hub/**', 'tools/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare static site
        run: python tools/prepare_site.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: '1200000'
          error_count: '30'
      - name: Retry transient deployment failure
        id: retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: '1200000'
          error_count: '30'
