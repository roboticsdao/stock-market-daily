name: Stock Market Daily
on:
  schedule:
    # UTC 23:00 = JST 8:00, for Japan market morning news.
    - cron: '0 23 * * *'
    # US market morning checks. During US daylight time:
    # UTC 12:00/13:15/14:00 = ET 8:00/9:15/10:00 = JST 21:00/22:15/23:00.
    # During US standard time, these run one hour earlier in ET.
    - cron: '0 12 * * *'
    - cron: '15 13 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:  # 手动触发
permissions:
  contents: write
concurrency:
  group: stock-market-daily-publish
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Test
        run: python -m unittest discover -v
      - name: Setup git
        run: |
          git config user.name "Stock Market Bot"
          git config user.email "bot@example.com"
      - name: Generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PUBLISH: 'false'
        run: python -u news_digest.py
      - name: Push
        run: |
          git add latest.html Stock_Market_Daily_*.html Stock_Market_Daily_*.md history.json
          git diff --cached --quiet || git commit -m "update $(date -u +%Y.%m.%d)"
          bash .github/scripts/push-generated.sh
